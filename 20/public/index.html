<!DOCTYPE html>
<!-- 20. Sistema Web Cliente-Servidor - Interface HTML -->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de tarefas</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1>Gerenciador de tarefas</h1>

    <form id="formulario">
      <input id="descricao" type="text" placeholder="Digite uma tarefa" required>
      <button type="submit">Adicionar</button>
    </form>

    <p id="mensagem"></p>
    <ul id="lista"></ul>
  </main>
</body>
</html>
